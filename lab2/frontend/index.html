<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Студенты — список</title>
  <link rel="icon" href="favicon/app.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <a href="index.html" class="logo">Учёт общежития</a>
        <span class="brand-note">учебный проект</span>
      </div>
      <nav class="nav" aria-label="Разделы">
        <a href="index.html" class="nav-link active" aria-current="page">Студенты</a>
        <a href="student-form.html" class="nav-link">Добавить запись</a>
      </nav>
    </div>
  </header>

  <main class="main" id="main-content">
    <div class="container">
      <div id="notice" class="notice" hidden></div>

      <div class="page-header">
        <h1>Студенты общежития</h1>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="dorm-count">0</div>
          <div class="stat-label">Студентов в списке</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="foreign-count">0</div>
          <div class="stat-label">Иностранных</div>
        </div>
      </div>

      <section class="list-panel" aria-label="Список студентов">
        <div class="controls">
          <a href="student-form.html" class="btn btn-primary">Добавить студента</a>
          <div class="search-box">
            <label for="search-input" class="search-label">Поиск</label>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Введите ФИО или группу..."
            >
          </div>
        </div>

        <form id="filters" class="filters" aria-label="Фильтры студентов">
          <div class="filter-field"><label for="filter-group">Группа</label><input id="filter-group" name="group" type="text" placeholder="M3301" maxlength="5" pattern="[A-Z][1-4][1-5][0-9]{2}"></div>
          <div class="filter-field"><label for="filter-dormitory">Общежитие</label><input id="filter-dormitory" name="dormitory" type="number" min="1" max="20" placeholder="1–20"></div>
          <div class="filter-field"><label for="filter-room">Комната</label><input id="filter-room" name="room" type="number" min="100" max="599" placeholder="100–599"></div>
          <div class="filter-field"><label for="filter-foreign">Гражданство</label><select id="filter-foreign" name="isForeign"><option value="">Все</option><option value="false">Граждане РФ</option><option value="true">Иностранные</option></select></div>
          <button type="submit" class="btn btn-primary">Применить</button>
          <button type="button" id="reset-filters" class="btn btn-secondary">Сбросить</button>
        </form>

        <div class="table-wrapper">
          <table class="students-table" id="students-table">
            <thead>
              <tr>
                <th>Студент</th>
                <th>Группа</th>
                <th>ИСУ ID</th>
                <th>Общежитие</th>
                <th>Срок заселения</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="students-table-body">
            </tbody>
          </table>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon"></div>
          <h2 id="empty-title" class="empty-title">Список пуст</h2>
          <p id="empty-text" class="empty-text">Добавьте первого студента</p>
          <a href="student-form.html" class="btn btn-primary">Добавить студента</a>
        </div>

        <div id="results-summary" class="results-summary"></div>
      </section>
    </div>
  </main>

  <script src="js/student-service.js"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
